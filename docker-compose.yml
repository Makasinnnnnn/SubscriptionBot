services:
  app:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --no-access-log
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://subscription:subscription@postgres:5432/subscription
    ports:
      - "8000:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  bot:
    build: .
    command: python main.py
    env_file: .env
    environment:
      APP_MODE: bot
      DATABASE_URL: postgresql+asyncpg://subscription:subscription@postgres:5432/subscription
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  scheduler:
    build: .
    command: python main.py
    env_file: .env
    environment:
      APP_MODE: scheduler
      DATABASE_URL: postgresql+asyncpg://subscription:subscription@postgres:5432/subscription
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrations:
    build: .
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://subscription:subscription@postgres:5432/subscription
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: subscription
      POSTGRES_USER: subscription
      POSTGRES_PASSWORD: subscription
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
